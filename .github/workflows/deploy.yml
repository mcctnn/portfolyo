name: Yayınla

on:
  push:
    branches: [main]
  # Panelden yeni blog yazısı eklenince, yazının kendi sayfası bir sonraki yayında üretilir.
  # Bu yüzden her gün bir kez yeniden yayınlanır (elle de çalıştırılabilir).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /portfolyo/
          SITE_URL: https://mcctnn.github.io/portfolyo
          # Bunlar herkese açık değerlerdir (yayınlanan sitede zaten görünür);
          # içerik yazma yetkisi Supabase'deki güvenlik kurallarıyla korunur.
          VITE_SUPABASE_URL: https://mfumxxsaosvcpaspsbzw.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_n9GeAJZMD5P8Pj-qeRwrQA_uDWqCsUL
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
